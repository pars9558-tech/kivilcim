
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIVILCIM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
    header{padding:20px;background:#191919;border-bottom:1px solid #333}
    header h1{margin:0;color:#ff6a00}
    main{max-width:650px;margin:25px auto;padding:15px}
    .card{background:#1c1c1c;border:1px solid #333;border-radius:15px;padding:18px;margin-bottom:16px}
    input,textarea{width:100%;padding:13px;margin:7px 0;background:#292929;color:white;border:1px solid #444;border-radius:9px}
    button{background:#ff6a00;color:white;border:0;border-radius:9px;padding:12px 17px;font-weight:bold;cursor:pointer;margin:5px 3px 5px 0}
    .secondary{background:#444}
    .muted{color:#aaa;font-size:13px}
    .post{border-bottom:1px solid #444;padding:12px 0}
    #app{display:none}
    #status{color:#ffb27c}
  </style>
</head>
<body>
<header>
  <h1>🔥 KIVILCIM</h1>
  <p class="muted">Fikirlerini paylaş, topluluğa katıl.</p>
</header>
<main>
  <section id="auth" class="card">
    <h2>Hesabına giriş yap</h2>
    <input id="email" type="email" placeholder="E-posta adresin">
    <input id="password" type="password" placeholder="Şifren">
    <button onclick="signIn()">Giriş yap</button>
    <button class="secondary" onclick="signUp()">Hesap oluştur</button>
    <p class="muted">Kayıt sonrası e-posta doğrulaması gerekebilir.</p>
  </section>

  <section id="app">
    <div class="card">
      <h2>Yeni gönderi</h2>
      <input id="postTitle" maxlength="100" placeholder="Gönderi başlığı">
      <textarea id="postContent" maxlength="2000" rows="4" placeholder="Ne paylaşmak istiyorsun?"></textarea>
      <button onclick="createPost()">Paylaş</button>
      <button class="secondary" onclick="signOut()">Çıkış yap</button>
      <p id="status"></p>
    </div>
    <div class="card">
      <h2>Topluluk gönderileri</h2>
      <div id="posts">Yükleniyor...</div>
    </div>
  </section>
</main>

<script>
  const SUPABASE_URL = "https://uctzwuvfduwxxlppstfx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_8HbldJQrYyT8yOTw2ZIQ_g_l7uVpus1";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const authPanel = document.getElementById("auth");
  const appPanel = document.getElementById("app");
  const statusBox = document.getElementById("status");

  function message(text){statusBox.textContent=text;}

  function escapeHTML(value){
    return String(value ?? "").replace(/[&<>"']/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  async function signUp(){
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;
    if(!email||password.length<8)return alert("E-posta gir ve en az 8 karakterli şifre kullan.");
    const {error}=await db.auth.signUp({email,password});
    if(error)return alert(error.message);
    alert("Kayıt isteğin alındı. E-posta doğrulaması gerekiyorsa gelen kutunu kontrol et.");
    await checkSession();
  }

  async function signIn(){
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;
    const {error}=await db.auth.signInWithPassword({email,password});
    if(error)return alert(error.message);
    await checkSession();
  }

  async function signOut(){
    const {error}=await db.auth.signOut();
    if(error)return alert(error.message);
    await checkSession();
  }

  async function checkSession(){
    const {data,error}=await db.auth.getSession();
    if(error)return alert(error.message);
    const loggedIn=!!data.session;
    authPanel.style.display=loggedIn?"none":"block";
    appPanel.style.display=loggedIn?"block":"none";
    if(loggedIn)await loadPosts();
  }

  async function createPost(){
    const title=document.getElementById("postTitle").value.trim();
    const content=document.getElementById("postContent").value.trim();
    if(!title||!content)return message("Başlık ve içerik boş bırakılamaz.");
    const {data:{user}}=await db.auth.getUser();
    if(!user)return message("Önce giriş yapmalısın.");
    const {error}=await db.from("posts").insert({user_id:user.id,title,content});
    if(error)return message("Hata: "+error.message);
    document.getElementById("postTitle").value="";
    document.getElementById("postContent").value="";
    message("Gönderin paylaşıldı!");
    await loadPosts();
  }

  async function loadPosts(){
    const container=document.getElementById("posts");
    container.textContent="Gönderiler yükleniyor...";
    const {data,error}=await db.from("posts")
      .select("id,title,content,created_at")
      .order("created_at",{ascending:false});
    if(error)return container.textContent="Hata: "+error.message;
    container.innerHTML="";
    if(!data||data.length===0){
      container.textContent="Henüz gönderi yok!";
      return;
    }
    data.forEach(post=>{
      const article=document.createElement("article");
      article.className="post";
      article.innerHTML=`
        <h3>${escapeHTML(post.title)}</h3>
        <p>${escapeHTML(post.content).replace(/\n/g,"<br>")}</p>
        <small class="muted">${escapeHTML(new Date(post.created_at).toLocaleString("tr-TR"))}</small>
      `;
      container.appendChild(article);
    });
  }

  db.auth.onAuthStateChange(()=>{checkSession();});
  checkSession();
</script>
</body>
</html>
